                method:
                  type: string
                  pattern: '^[A-Z][A-Z0-9_-]{0,31}$'
                host:
                  type: string
                  minLength: 1
                  maxLength: 253
                path:
                  type: string
                  minLength: 1
                  maxLength: 2048
                  pattern: '^/'
