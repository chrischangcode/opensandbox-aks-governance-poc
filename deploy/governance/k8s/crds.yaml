                    tenantId:
                      type: string
                      format: uuid
                    objectId:
                      type: string
                      format: uuid
                    displayName:
                      type: string
                      minLength: 1
                      maxLength: 256
                    logicalTenant:
                      type: string
                      minLength: 1
                      maxLength: 128
                    team:
                      type: string
                      minLength: 1
                      maxLength: 128
                decisionReason:
                  type: string
                  minLength: 3
                  maxLength: 512
                approvedAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
              x-kubernetes-validations:
                - rule: 'self.state != "Approved" || (has(self.approver) && has(self.decisionReason) && has(self.approvedAt) && has(self.expiresAt) && timestamp(self.expiresAt) > timestamp(self.approvedAt))'
                  message: approved requests require approver, decision reason, and increasing approval/expiry timestamps
                - rule: 'self.state != "Denied" || (has(self.approver) && has(self.decisionReason))'
                  message: denied requests require approver and decision reason
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
        - name: Assignment
          type: string
          jsonPath: .spec.assignmentRef.name
        - name: Backend
          type: string
          jsonPath: .spec.backend
        - name: Method
          type: string
          jsonPath: .spec.method
        - name: Host
          type: string
          jsonPath: .spec.host
        - name: Expires
          type: date
          jsonPath: .status.expiresAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
