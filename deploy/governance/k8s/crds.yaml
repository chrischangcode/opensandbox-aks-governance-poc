    shortNames: [sbtenant]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required:
                - logicalTenant
                - workloadNamespace
                - allowedCapabilityBundles
                - allowedCapabilityBundlePrefixes
                - maxConcurrentSandboxes
                - maxLifetimeSeconds
                - maxAccessRequestDurationSeconds
                - maxCpu
                - maxMemory
                - enabled
              properties:
                logicalTenant:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                workloadNamespace:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                allowedCapabilityBundles:
                  type: array
                  maxItems: 128
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 1
                    maxLength: 253
                allowedCapabilityBundlePrefixes:
                  type: array
                  maxItems: 128
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 2
                    maxLength: 63
                    pattern: '^[a-z0-9]([-a-z0-9]*-)$'
                maxConcurrentSandboxes:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 1000
                maxLifetimeSeconds:
                  type: integer
                  format: int32
                  minimum: 60
                  maximum: 86400
                maxAccessRequestDurationSeconds:
                  type: integer
                  format: int32
                  minimum: 60
                  maximum: 28800
                maxCpu: { type: string, minLength: 1, maxLength: 32 }
                maxMemory: { type: string, minLength: 1, maxLength: 32 }
                enabled: { type: boolean }
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: SandboxTenantPolicy.spec is immutable; create a new policy revision instead
                - rule: 'size(self.allowedCapabilityBundles) + size(self.allowedCapabilityBundlePrefixes) > 0'
                  message: at least one exact bundle or bundle prefix is required
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.logicalTenant
        - name: Namespace
          type: string
          jsonPath: .spec.workloadNamespace
        - name: Concurrent
          type: integer
          jsonPath: .spec.maxConcurrentSandboxes
        - name: Lifetime
          type: integer
          jsonPath: .spec.maxLifetimeSeconds
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
