                      type: string
                      minLength: 1
                      maxLength: 128
                    team:
                      type: string
                      minLength: 1
                      maxLength: 128
                requestedDurationSeconds:
                  type: integer
                  format: int32
                  minimum: 60
                  maximum: 28800
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: SandboxAccessRequest.spec is immutable
                - rule: '!self.path.contains("?") && !self.path.contains("#")'
