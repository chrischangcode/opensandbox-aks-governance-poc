apiVersion: aks-sandbox.azure.com/v1alpha1
kind: CapabilityBundle
metadata:
  name: team-a-reader
  namespace: aks-sandbox-system
spec:
  governance:
    logicalTenant: tenant-a
    team: readers
    permissionLevel: reader
    displayName: Team A read-only sandbox
---
apiVersion: aks-sandbox.azure.com/v1alpha1
kind: CapabilityBundle
metadata:
  name: team-a-contributor
  namespace: aks-sandbox-system
spec:
  governance:
    logicalTenant: tenant-a
    team: contributors
    permissionLevel: contributor
    displayName: Team A contributor sandbox
  egress:
    agentgateway:
      source-control:
        allow: request.method == "GET" && request.host == "github.com"
---
apiVersion: aks-sandbox.azure.com/v1alpha1
kind: CapabilityBundle
metadata:
  name: team-b-reader
  namespace: aks-sandbox-system
spec:
  governance:
    logicalTenant: tenant-b
    team: readers
    permissionLevel: reader
    displayName: Team B read-only sandbox
---
apiVersion: aks-sandbox.azure.com/v1alpha1
kind: CapabilityBundle
metadata:
  name: team-a-harness-reader-v1
  namespace: aks-sandbox-system
spec:
  governance:
    logicalTenant: tenant-a
    team: readers
    permissionLevel: reader
    displayName: Team A sandbox-only harness
  harness:
    commandPolicy:
      - pattern: '^uname -a && python --version$'
        decision: allow
        reason: Read-only runtime identity demonstration.
---
apiVersion: aks-sandbox.azure.com/v1alpha1
kind: CapabilityBundle
metadata:
  name: team-a-web-reader-v1
  namespace: aks-sandbox-system
spec:
  governance:
    logicalTenant: tenant-a
    team: readers
    permissionLevel: reader
    displayName: Team A approved web reader
  egress:
    agentgateway:
      external-web:
        allow: request.method == "GET" && request.host == "example.com" && request.path == "/docs"
  harness:
    commandPolicy:
      - pattern: '^uname -a && python --version$'
        decision: allow
        reason: Read-only runtime identity demonstration.
